# Every push to master is checked and built for every home the client has:
# Windows installers for x64, 32-bit x86 and ARM64, a debug Android APK and the web
# bundle. Each push gets an immutable pre-release; `dev/latest.json` points
# to the newest one. A matching `vX.Y.Z` tag makes a stable release. PRs get
# workflow artifacts. iOS is left out: it is built on a Mac and uploaded to
# TestFlight by hand (apps/mobile/README.md).
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Do not interrupt a release between uploading its packages and promoting its feed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Typecheck, test, web bundle
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        run: node scripts/release.mjs prepare
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @meshnet/web build
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-web
          path: apps/web/dist
          if-no-files-found: error

  desktop-windows:
    name: Windows ${{ matrix.arch }}
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            vc-arch: amd64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            vc-arch: amd64_arm64
          # 32-bit Windows, for older machines; WebView2 and WinRT Bluetooth both run there.
          - arch: x86
            target: i686-pc-windows-msvc
            vc-arch: amd64_x86
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vc-arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs prepare
      # PR/local packages do not need the private key. Publishing fails closed if it is missing.
      - name: Build NSIS and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.check.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: pnpm --filter @meshnet/desktop exec tauri build --config src-tauri/tauri.release.json --target ${{ matrix.target }} --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-windows-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Relay checks
        run: bash apps/mobile/android/tests/run.sh
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs prepare
      # A fixed debug key lets each APK install over the previous one. PRs from forks
      # have no secrets and fall back to a throwaway key.
      - name: Build APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            export ANDROID_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/debug.keystore"
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$ANDROID_DEBUG_KEYSTORE_PATH"
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_BASE64; this APK will not install over earlier ones."
          fi
          pnpm --filter @meshnet/mobile android:apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep SHA-256
      - uses: actions/upload-artifact@v4
        with:
          name: meshnet-android
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish
    needs: [check, desktop-windows, android]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: meshnet-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Lay out the files
        run: |
          mkdir out
          cp artifacts/meshnet-windows-x64/*.exe* out/
          cp artifacts/meshnet-windows-arm64/*.exe* out/
          cp artifacts/meshnet-windows-x86/*.exe* out/
          cp artifacts/meshnet-android/app-debug.apk out/Meshnet_android-debug.apk
          (cd artifacts/meshnet-web && zip -qr ../../out/Meshnet_web.zip .)
          ls -l out
      - name: Create the complete update feed
        run: node scripts/release.mjs manifest out
      - name: Publish signed release, then promote the channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish out
